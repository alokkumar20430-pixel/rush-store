
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUSH — Game Store</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
}

body {
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 7%;
    background: #19191f;
}

.logo {
    color: #a970ff;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

nav a {
    color: #ccc;
    text-decoration: none;
    margin-left: 22px;
}

nav a:hover {
    color: #a970ff;
}

.hero {
    padding: 65px 7%;
    background: linear-gradient(110deg, #30105b, #11111a);
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.hero p {
    color: #bbb;
}

.container {
    padding: 35px 7%;
}

.section-title {
    margin-bottom: 20px;
    font-size: 25px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
}

.game {
    border-radius: 12px;
    overflow: hidden;
    background: #1c1c24;
    border: 1px solid #30303a;
    cursor: pointer;
    transition: 0.2s;
}

.game:hover {
    transform: translateY(-5px);
    border-color: #a970ff;
}

.banner {
    height: 190px;
    display: flex;
    align-items: end;
    padding: 22px;
    position: relative;
    overflow: hidden;
}

.banner h2 {
    position: relative;
    z-index: 2;
    font-size: 29px;
    text-shadow: 0 2px 8px black;
}

.minecraft-banner {
    background:
        linear-gradient(0deg, #10220f, transparent 85%),
        linear-gradient(120deg, #477e38, #80ad55, #273f26);
}

.minecraft-banner::before {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    right: 35px;
    top: 15px;
    background: #739d49;
    box-shadow:
        -35px 45px 0 #4a7937,
        35px 65px 0 #365c2c;
    transform: rotate(15deg);
}

.freefire-banner {
    background:
        linear-gradient(0deg, #280c0b, transparent 85%),
        linear-gradient(120deg, #e04c20, #86272c, #24121d);
}

.freefire-banner::before {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    right: 40px;
    top: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffad40, #c83a24, #50161c);
    box-shadow: 0 0 45px #ff6b30;
}

.game-info {
    padding: 17px;
}

.game-info p {
    color: #999;
    margin-top: 8px;
}

.game-info .price {
    color: #ad80ff;
    font-weight: bold;
}

.platform {
    display: inline-block;
    margin-top: 12px;
    padding: 5px 9px;
    background: #30233f;
    color: #c5a3ff;
    border-radius: 5px;
    font-size: 12px;
}

.details {
    display: none;
    padding: 35px 7%;
    min-height: 65vh;
}

.details.active {
    display: block;
}

.details-banner {
    height: 220px;
    border-radius: 12px;
    display: flex;
    align-items: end;
    padding: 25px;
    margin: 25px 0;
}

.details h1 {
    font-size: 35px;
}

.details p {
    color: #bbb;
    line-height: 1.7;
    margin: 15px 0;
    max-width: 650px;
}

.back {
    background: #292933;
    margin-bottom: 20px;
}

.download {
    display: inline-block;
    text-decoration: none;
    color: white;
    background: #914cff;
    padding: 13px 22px;
    border-radius: 6px;
    margin-top: 12px;
}

.download:hover {
    background: #7837df;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    border-top: 1px solid #292933;
}

@media(max-width: 600px) {
    header {
        padding: 18px;
    }

    nav a {
        margin-left: 9px;
        font-size: 12px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .container {
        padding: 25px 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">RUSH.</div>

    <nav>
        <a href="#" onclick="showHome()">Home</a>
        <a href="#store" onclick="showHome()">Store</a>
    </nav>
</header>

<section class="hero" id="hero">
    <h1>DISCOVER YOUR NEXT GAME.</h1>
    <p>Your next adventure starts here.</p>
</section>

<main id="home">

<section class="container" id="store">

    <h2 class="section-title">Featured Games</h2>

    <div class="game-grid">

        <div class="game" onclick="showGame('minecraft')">

            <div class="banner minecraft-banner">
                <h2>MINECRAFT</h2>
            </div>

            <div class="game-info">
                <h3>Minecraft</h3>
                <p>Build, explore and survive.</p>
                <span class="platform">PC / MOBILE</span>
                <p class="price">Paid</p>
            </div>

        </div>

        <div class="game" onclick="showGame('freefire')">

            <div class="banner freefire-banner">
                <h2>FREE FIRE</h2>
            </div>

            <div class="game-info">
                <h3>Free Fire</h3>
                <p>Battle royale experience.</p>
                <span class="platform">MOBILE</span>
                <p class="price">Free</p>
            </div>

        </div>

    </div>

</section>

</main>

<section class="details" id="details">

    <button class="back" onclick="showHome()">Back to Store</button>

    <div id="game-content"></div>

</section>

<footer>
    RUSH. Digital Game Store
    <br><br>
    © 2026 RUSH
</footer>

<script>

const games = {

    minecraft: {
        name: "Minecraft",
        description:
        "Explore infinite worlds, build amazing structures, gather resources and survive. Minecraft lets you create your own adventures.",
        platform: "PC / Android / iOS",
        price: "Paid",
        banner: "minecraft-banner",
        link: "https://www.minecraft.net/download"
    },

    freefire: {
        name: "Free Fire",
        description:
        "Experience an action-packed mobile battle royale game. Explore different modes, compete with other players and aim for victory.",
        platform: "Android / iOS",
        price: "Free",
        banner: "freefire-banner",
        link: "https://play.google.com/store/apps/details?id=com.garena.game.ffi"
    }

};

function showGame(id) {

    const game = games[id];

    document.getElementById("home").style.display = "none";
    document.getElementById("hero").style.display = "none";

    const details = document.getElementById("details");

    details.classList.add("active");

    document.getElementById("game-content").innerHTML = `

        <div class="details-banner ${game.banner}">
            <h1>${game.name}</h1>
        </div>

        <h1>${game.name}</h1>

        <p>${game.description}</p>

        <p><strong>Platform:</strong> ${game.platform}</p>

        <p><strong>Price:</strong> ${game.price}</p>

        <a class="download"
           href="${game.link}"
           target="_blank"
           rel="noopener noreferrer">
           View Download Options
        </a>

    `;

    window.scrollTo(0, 0);
}

function showHome() {

    document.getElementById("home").style.display = "block";
    document.getElementById("hero").style.display = "block";

    document.getElementById("details").classList.remove("active");

    window.scrollTo(0, 0);
}

</script>

</body>
</html>
