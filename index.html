
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUSH - Game Store</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 7%;
    background: #19191f;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #a970ff;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

.hero {
    padding: 65px 7%;
    background: linear-gradient(120deg, #30105b, #11111a);
}

.hero h1 {
    font-size: 42px;
}

.hero p {
    color: #c5c5d0;
}

button {
    background: #914cff;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
}

.container {
    padding: 30px 7%;
}

#search {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    background: #202027;
    border: 1px solid #393943;
    border-radius: 7px;
    color: white;
}

.filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.game {
    background: #1c1c24;
    border-radius: 10px;
    overflow: hidden;
}

.cover {
    height: 130px;
    display: grid;
    place-items: center;
    font-size: 45px;
    background: linear-gradient(135deg, #402078, #171727);
}

.game-info {
    padding: 15px;
}

.price {
    color: #a970ff;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media(max-width: 600px) {
    header {
        padding: 18px;
    }

    nav a {
        margin-left: 8px;
        font-size: 12px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .container {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">RUSH.</div>

    <nav>
        <a href="#">Home</a>
        <a href="#store">Store</a>
        <a href="#games">Games</a>
    </nav>
</header>

<section class="hero">
    <h1>LEVEL UP YOUR GAMING.</h1>
    <p>Discover your next favourite game at RUSH.</p>
    <button onclick="document.getElementById('store').scrollIntoView()">
        Explore Games
    </button>
</section>

<main class="container" id="store">

    <h2>Discover Games</h2>

    <input
        type="text"
        id="search"
        placeholder="Search games..."
        oninput="filterGames()"
    >

    <div class="filters">
        <button onclick="setFilter('All')">All</button>
        <button onclick="setFilter('PC')">PC</button>
        <button onclick="setFilter('Mobile')">Mobile</button>
        <button onclick="setFilter('Free')">Free</button>
    </div>

    <div class="game-grid" id="games">

        <div class="game" data-name="Minecraft" data-platform="PC" data-price="Paid">
            <div class="cover">⛏️</div>
            <div class="game-info">
                <h3>Minecraft</h3>
                <p>PC Edition</p>
                <p class="price">$29.99</p>
            </div>
        </div>

        <div class="game" data-name="Valorant" data-platform="PC" data-price="Free">
            <div class="cover">🎯</div>
            <div class="game-info">
                <h3>Valorant</h3>
                <p>PC Edition</p>
                <p class="price">FREE</p>
            </div>
        </div>

        <div class="game" data-name="Free Fire" data-platform="Mobile" data-price="Free">
            <div class="cover">🔥</div>
            <div class="game-info">
                <h3>Free Fire</h3>
                <p>Mobile Edition</p>
                <p class="price">FREE</p>
            </div>
        </div>

        <div class="game" data-name="Stardew Valley" data-platform="Mobile" data-price="Paid">
            <div class="cover">🌾</div>
            <div class="game-info">
                <h3>Stardew Valley</h3>
                <p>Mobile Edition</p>
                <p class="price">$4.99</p>
            </div>
        </div>

    </div>
</main>

<footer>
    © 2026 RUSH. All rights reserved.
</footer>

<script>
let currentFilter = "All";

function setFilter(filter) {
    currentFilter = filter;
    filterGames();
}

function filterGames() {
    let search = document.getElementById("search").value.toLowerCase();

    let games = document.querySelectorAll(".game");

    games.forEach(game => {
        let name = game.dataset.name.toLowerCase();
        let platform = game.dataset.platform;
        let price = game.dataset.price;

        let matchesSearch = name.includes(search);

        let matchesFilter =
            currentFilter === "All" ||
            platform === currentFilter ||
            price === currentFilter;

        game.style.display =
            matchesSearch && matchesFilter ? "block" : "none";
    });
}
</script>

</body>
  </html>
